[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF"]
# Odoo idioms that are not defects:
# F401  - addon __init__ files import submodules for their side effects
# B018  - __manifest__.py is a bare dict literal
# RUF012 - _sql_constraints and friends are class-level mutable attributes
ignore = ["B018", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# CSV fixtures mirror Locust's export format line by line
"**/tests/*" = ["E501"]
